[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-course-reference"
version = "0.1.0"
description = "Deterministic reference implementation for the AI Agent course"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "mcp>=1.27,<2",
    "pydantic",
    "pydantic-settings",
    "uvicorn",
]

[project.optional-dependencies]
live = [
    "openai",
    "openai-agents",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_course"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88
