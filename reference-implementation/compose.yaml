services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["pgvector"]
    environment:
      POSTGRES_DB: agent_course
      POSTGRES_USER: agent_course
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_course -d agent_course"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgvector-data:/var/lib/postgresql/data

volumes:
  pgvector-data:
