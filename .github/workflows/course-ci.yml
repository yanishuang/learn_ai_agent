name: Course validation

on:
  push:
  pull_request:

jobs:
  validate-course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_validate_course.py -q
      - run: python scripts/validate_course.py
      - run: uv lock --check
        working-directory: reference-implementation
      - run: uv sync --frozen --group dev --extra live
        working-directory: reference-implementation
      - run: uv run --frozen --no-sync --group dev --extra live pytest -q -m "not live"
        working-directory: reference-implementation
      - run: uv run --frozen --no-sync --group dev --extra live ruff check .
        working-directory: reference-implementation
